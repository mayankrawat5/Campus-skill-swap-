<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CampusLoop — Skill Swap Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script>if(!localStorage.getItem("campusloop-current-user")){window.location.replace("login.html")}</script>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="CampusLoop home"><span class="brand-mark">↗</span><span>campus<span class="brand-light">loop</span></span></a>
      <div class="campus-label">STUDENT WORKSPACE</div>
      <nav class="nav-list" id="navList">
        <button class="nav-item active" data-page="dashboard"><span>◫</span> Overview</button>
        <button class="nav-item" data-page="discover"><span>⌕</span> Discover skills</button>
        <button class="nav-item" data-page="requests"><span>⇄</span> Exchange requests <i id="requestBadge">2</i></button>
        <button class="nav-item" data-page="sessions"><span>▦</span> My sessions</button>
        <button class="nav-item" data-page="myskills"><span>✳</span> My skills</button>
        <button class="nav-item" data-page="history"><span>◷</span> Skill history</button>
        <button class="nav-item" data-page="learningmap"><span>⌁</span> Skill evolution map</button>
        <button class="nav-item" data-page="notifications"><span>♧</span> Notifications <i id="notificationBadge">3</i></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">✦</div><b>Every skill has value.</b><p>Share what you know. Learn what you love.</p><button data-page="discover" class="text-button">Find your next skill <span>→</span></button></div>
        <button class="nav-item admin-link" data-page="admin"><span>⚙</span> Admin dashboard</button>
        <div class="profile-mini"><div class="avatar avatar-violet">AS</div><div class="profile-mini-text"><b id="sideName">Aarav Sharma</b><span id="sideDept">Computer Science · Year 3</span></div><button class="more-button" id="profileMenu" aria-label="Profile options">···</button></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button id="mobileMenu" class="icon-button mobile-only" aria-label="Open menu">☰</button><div class="crumb"><span>Workspace</span><span class="crumb-slash">/</span><b id="pageCrumb">Overview</b></div><div class="top-actions"><span class="campus-chip"><span class="online-dot"></span> Campus network</span><button class="icon-button" data-page="notifications" aria-label="Notifications">♧<span class="tiny-dot"></span></button><div class="avatar avatar-violet top-avatar">AS</div><button class="icon-button logout-button" data-action="logout" title="Sign out" aria-label="Sign out">↪</button></div></header>
      <div id="pageContent" class="page-content"></div>
      <footer class="footer">Made for campus, powered by community <span>✦</span><span class="footer-right">CampusLoop · PBL Project</span></footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
